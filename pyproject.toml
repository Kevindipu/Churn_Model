[project]
name = "churn-model"
version = "0.1.0"
description = "MLOps project for customer churn prediction"
readme = "README.md"
authors = [
    { name = "Kevindipu", email = "kevindipu17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
churn-model = "churn_model:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
